schema = 1
profiles = ["rust"]

[tools.rust]
command = ["rustc", "--version"]
pattern = "^rustc 1[.]99[.]1"

[commands.rust]
lint = ["cargo", "clippy", "--locked", "--workspace", "--all-targets", "--", "-D", "warnings"]
test = ["cargo", "test", "--locked", "--workspace"]
build = ["cargo", "build", "--locked", "--workspace", "--release"]
policy = ["cargo", "deny", "--locked", "--all-features", "check", "licenses", "sources"]

[timeouts]
rust = 900

[extras.advisories]
purpose = "Check the locked dependencies against current RustSec advisories"
command = ["cargo", "audit", "--deny", "warnings"]
timeout = 600

[extras.qualification-fmt]
purpose = "Standalone qualification crates keep the pinned edition style"
command = ["rustfmt", "--edition", "2024", "--check", "src/screen.rs", "qualification/screen.rs", "qualification/browser/transport.rs", "qualification/browser/fixture.rs", "qualification/browser/receiver_probe.rs", "qualification/library.rs", "qualification/owned-library.rs"]
timeout = 120

[extras.owned-screen]
purpose = "Lint and unit-test the optional owned-screen feature"
command = ["cargo", "test", "--locked", "--features", "owned-screen", "--lib"]
timeout = 900
